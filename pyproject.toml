[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchloop"
version = "0.1.0"
description = "Authorization rules at the tool boundary of AI agents: record, enforce and report every tool call."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Framework adapters. Lower bounds are the versions the adapter tests run against.
fastmcp = ["fastmcp>=3.1"]
langchain = ["langchain>=1.2", "langgraph>=1.1"]
strands = ["strands-agents>=1.26"]
dev = ["pytest>=8", "jsonschema>=4", "patchloop[fastmcp,langchain,strands]"]

[project.scripts]
patchloop = "patchloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["patchloop*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
