[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchloop"
version = "0.1.0"
description = "Find prompt-only policy rules in tool-using agents and repair them with tested guard code."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["patchloop*"]

[tool.setuptools.package-data]
"patchloop" = ["utility_manifest.json"]
"patchloop.apps.tau_retail" = ["*.json", "*.md", "LICENSE.sierra", "data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
