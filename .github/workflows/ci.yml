name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly: adapters run against the newest framework releases
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Allow bubblewrap user namespaces for the sandbox tests
        run: |
          sudo apt-get update -q && sudo apt-get install -yq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  adapters:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {extra: fastmcp, tests: "fastmcp or mcp_client or wrap"}
          - {extra: langchain, tests: "langgraph or langchain"}
          - {extra: strands, tests: "strands"}
          - {extra: openai-agents, tests: "openai_agents"}
          - {extra: claude-agent-sdk, tests: "claude_agent_sdk"}
          - {extra: google-adk, tests: "google_adk"}
          - {extra: llamaindex, tests: "llamaindex"}
          - {extra: pydantic-ai, tests: "pydantic_ai"}
          - {extra: crewai, tests: "crewai"}
    env:
      CREWAI_TELEMETRY_OPT_OUT: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,${{ matrix.extra }}]'
      - name: Adapter tests (a skipped test fails the job)
        shell: bash  # bash with pipefail, so a pytest failure is not hidden by tee
        run: |
          python -m pytest -q -rs tests/test_integrations.py -k "${{ matrix.tests }}" | tee result.txt
          ! grep -q "SKIPPED" result.txt
